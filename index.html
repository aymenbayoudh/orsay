<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2e9"><title>Orsay · Les œuvres</title><meta name="description" content="Les œuvres du musée d’Orsay par salle, en liste ou en images, avec vos favoris."><link rel="stylesheet" href="style.css?v=df952b923174"></head><body>
<header><a class="wordmark" href="./" aria-label="Orsay, accueil"><img class="museum-logo" src="logo-orsay.png" alt="Musée d’Orsay" width="1912" height="1141"></a><button id="favorites" aria-pressed="false"><span>Mes favoris</span> <b id="favcount">0</b></button></header>
<main><section class="intro"><h1>Les œuvres d’Orsay</h1></section>
<section class="explorer" aria-label="Explorer les collections"><div class="filters"><label>Étage<select id="floor"><option value="">Tous les étages</option></select></label><label>Salle<select id="room"><option value="">Toutes les salles</option></select></label><label>Rechercher une salle<input id="roomsearch" type="search" placeholder="Ex. 43, 8a…"></label><label class="wide">Œuvre ou artiste<input id="search" type="search" placeholder="Monet, Nymphéas, n° d’inventaire…" autocomplete="off"></label></div>
<div id="rooms" class="roomchips" aria-label="Choisir une salle"></div>
<div class="resultsbar"><div><h2 id="heading">Toutes les salles</h2><p id="count" role="status" aria-live="polite">Chargement des œuvres…</p></div><button id="reset">Réinitialiser</button></div>
<div class="toolbar"><div class="view-switch" role="group" aria-label="Affichage"><button id="listview" aria-pressed="true" aria-label="Affichage en liste" title="Liste"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="4" height="4" rx="1"/><rect x="10" y="3" width="11" height="4" rx="1"/><rect x="3" y="10" width="4" height="4" rx="1"/><rect x="10" y="10" width="11" height="4" rx="1"/><rect x="3" y="17" width="4" height="4" rx="1"/><rect x="10" y="17" width="11" height="4" rx="1"/></g></svg><span class="sr-only">Liste</span></button><button id="gridview" aria-pressed="false" aria-label="Affichage en grille" title="Grille"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="10" rx="1"/><rect x="14" y="3" width="7" height="6" rx="1"/><rect x="3" y="17" width="7" height="4" rx="1"/><rect x="14" y="13" width="7" height="8" rx="1"/></g></svg><span class="sr-only">Grille</span></button></div><button id="random" title="Une œuvre au hasard dans la sélection"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><g fill="currentColor"><circle cx="8" cy="8" r="1.5"/><circle cx="16" cy="8" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="8" cy="16" r="1.5"/><circle cx="16" cy="16" r="1.5"/></g></svg>Hasard</button><button id="allresults" hidden>Tout afficher</button></div>
<div id="favorite-tools" class="favorite-tools" hidden><button id="export-favorites">Exporter</button><button id="import-favorites">Importer</button><input id="favorites-file" type="file" accept="application/json,.json" hidden><p id="transfer-status" role="status" aria-live="polite"></p></div>
<button id="retry-catalogue" hidden>Réessayer le chargement</button><p id="roomnote" class="roomnote" hidden></p><div id="navigation" hidden><button id="prev">Salle précédente</button><button id="next">Salle suivante</button></div>
<div id="works" class="works-list"></div></section>
<footer><p id="updated"></p><p>Les favoris sont enregistrés sur cet appareil et peuvent être transférés avec Exporter et Importer. Les localisations suivent le catalogue officiel et peuvent évoluer.</p><a href="https://www.musee-orsay.fr/fr/collections/recherche" target="_blank" rel="noopener">Catalogue officiel</a> · <a href="https://www.musee-orsay.fr/sites/default/files/2026-03/plan-guide%20ORSAY%20Europe%20printemps26.pdf" target="_blank" rel="noopener">Plan des salles</a></footer></main><script src="app.js?v=bac6ba158c6c" defer></script></body></html>
